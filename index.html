<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Раскраска: Time to Eat!</title>
        <style>
            :root {
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top,0px);
                padding-bottom: env(safe-area-inset-bottom,0px);
                --bg: #fffaf0;
                --fg: #2b2b2b;
                --card: #fff;
                --line: #e3d9c4;
                --accent: #7c4dff;
                color-scheme: light
            }

            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --bg:#1f1d2b;
                    --fg: #f2efe8;
                    --card: #2a2840;
                    --line: #45425f;
                    color-scheme: dark
                }
            }

            :root[data-theme="dark"] {
                --bg: #1f1d2b;
                --fg: #f2efe8;
                --card: #2a2840;
                --line: #45425f;
                color-scheme: dark
            }

            html {
                scroll-padding-top: env(safe-area-inset-top,0px)
            }

            * {
                box-sizing: border-box
            }

            body {
                margin: 0;
                background: var(--bg);
                color: var(--fg);
                font-family: "Nunito","Segoe UI",system-ui,sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 10px
            }

            .tabs {
                display: flex;
                gap: 8px;
                margin-bottom: 10px
            }

            .tab {
                padding: 8px 18px;
                border-radius: 999px;
                border: 2px solid var(--line);
                background: var(--card);
                color: var(--fg);
                font: inherit;
                font-weight: 700;
                cursor: pointer
            }

            .tab.on {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff
            }

            .wrap {
                display: flex;
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
                max-width: 1100px
            }

            .tools {
                background: var(--card);
                border: 2px solid var(--line);
                border-radius: 16px;
                padding: 12px;
                width: 240px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                align-self: flex-start
            }

            .sw {
                display: grid;
                grid-template-columns: repeat(4,1fr);
                gap: 8px
            }

            .sw button {
                aspect-ratio: 1;
                border-radius: 50%;
                border: 3px solid transparent;
                cursor: pointer;
                box-shadow: 0 0 0 1px #0003 inset
            }

            .sw button.on {
                border-color: var(--fg);
                transform: scale(1.1)
            }

            .pick {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 14px
            }

            .pick input[type=color] {
                width: 56px;
                height: 40px;
                border: none;
                background: none;
                padding: 0;
                cursor: pointer
            }

            .row {
                display: flex;
                gap: 6px;
                flex-wrap: wrap
            }

            .btn {
                flex: 1;
                padding: 8px 8px;
                border-radius: 10px;
                border: 2px solid var(--line);
                background: var(--card);
                color: var(--fg);
                font: inherit;
                font-size: 14px;
                cursor: pointer;
                white-space: nowrap
            }

            .btn.on {
                border-color: var(--accent);
                background: var(--accent);
                color: #fff
            }

            .say {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 14px
            }

            .stage {
                background: #fff;
                border: 2px solid var(--line);
                border-radius: 16px;
                flex: 1 1 380px;
                max-width: 760px;
                position: relative;
                overflow: hidden
            }

            canvas {
                width: 100%;
                height: auto;
                display: block;
                touch-action: manipulation;
                cursor: pointer
            }

            canvas.brush {
                touch-action: none
            }

            #label {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 6px;
                text-align: center;
                font-size: clamp(18px,3.5vw,28px);
                font-weight: 800;
                color: #333;
                pointer-events: none;
                text-shadow: 0 0 6px #fff,0 0 6px #fff
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <div class="tools">
                <div class="row">
                    <button class="btn on" id="mFill">Заливка</button>
                    <button class="btn" id="mBrush">Кисть</button>
                </div>
                <label class="pick" id="sizeRow" style="display:none">
                    Кисть: <input type="range" id="size" min="3" max="30" value="12">
                </label>
                <div class="sw" id="sw"></div>
                <label class="pick">
                    Свой цвет: <input type="color" id="cp" value="#ff7043">
                </label>
                <div class="row">
                    <button class="btn" id="eraser">Ластик</button>
                    <button class="btn" id="undo">Назад</button>
                    <button class="btn" id="reset">Очистить</button>
                </div>
                <button class="btn on" id="snd" aria-pressed="true">🔊 Звук включён</button>
            </div>
            <div class="stage">
                <canvas id="cv"></canvas>
                <div id="label"></div>
            </div>
        </div>

                }
                document.getElementById("mFill").onclick = function() {
                    setMode("fill")
                }
                ;
                document.getElementById("mBrush").onclick = function() {
                    setMode("brush")
                }
                ;

                function build(key, cb) {
                    var img = new Image();
                    img.onload = function() {
                        var w = img.width
                          , h = img.height
                          , o = document.createElement("canvas");
                        o.width = w;
                        o.height = h;
                        var oc = o.getContext("2d");
                        oc.drawImage(img, 0, 0);
                        var id = oc.getImageData(0, 0, w, h)
                          , d = id.data
                          , n = w * h;
                        var lum = new Uint8Array(n)
                          , orig = new Uint8ClampedArray(d);
                        for (var i = 0; i < n; i++)
                            lum[i] = (d[i * 4] * 0.3 + d[i * 4 + 1] * 0.59 + d[i * 4 + 2] * 0.11) | 0;
                        var bar = new Uint8Array(n);
                        var thin = new Uint8Array(n);
                        for (i = 0; i < n; i++)
                            if (lum[i] < 170)
                                thin[i] = 1;
                        var tmp = new Uint8Array(n);
                        for (var it = 0; it < 2; it++) {
                            tmp.set(thin);
                            for (var yy = 0; yy < h; yy++)
                                for (var xx = 0; xx < w; xx++) {
                                    var q0 = yy * w + xx;
                                    if (tmp[q0])
                                        continue;
                                    if ((xx > 0 && tmp[q0 - 1]) || (xx < w - 1 && tmp[q0 + 1]) || (yy > 0 && tmp[q0 - w]) || (yy < h - 1 && tmp[q0 + w]) || (xx > 0 && yy > 0 && tmp[q0 - w - 1]) || (xx < w - 1 && yy > 0 && tmp[q0 - w + 1]) || (xx > 0 && yy < h - 1 && tmp[q0 + w - 1]) || (xx < w - 1 && yy < h - 1 && tmp[q0 + w + 1]))
                                        thin[q0] = 1;
                                }
                        }
                        for (i = 0; i < n; i++)
                            if (thin[i])
                                bar[i] = 1;
                        var cut = new Uint8Array(n);
                        (CUTS[key] || []).forEach(function(pl) {
                            for (var s = 0; s < pl.length - 1; s++) {
                                var x0 = pl[s][0]
                                  , y0 = pl[s][1]
                                  , x1 = pl[s + 1][0]
                                  , y1 = pl[s + 1][1];
                                var steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
                                for (var k = 0; k <= steps; k++) {
                                    var x = Math.round(x0 + (x1 - x0) * k / steps)
                                      , y = Math.round(y0 + (y1 - y0) * k / steps);
                                    for (var dy = -1; dy <= 1; dy++)
                                        for (var dx = -1; dx <= 1; dx++) {
                                            var xx = x + dx
                                              , yy = y + dy;
                                            if (xx >= 0 && yy >= 0 && xx < w && yy < h) {
                                                cut[yy * w + xx] = 1;
                                                bar[yy * w + xx] = 1
                                            }
                                        }
                                }
                            }
                        });
                        var label_ = new Int32Array(n)
                          , L = 0
                          , stack = new Int32Array(n);
                        for (var p = 0; p < n; p++) {
                            if (bar[p] || label_[p])
                                continue;
                            L++;
                            var sp = 0;
                            stack[sp++] = p;
                            label_[p] = L;
                            while (sp) {
                                var q = stack[--sp], x = q % w, y = (q / w) | 0, r;
                                if (x > 0) {
                                    r = q - 1;
                                    if (!bar[r] && !label_[r]) {
                                        label_[r] = L;
                                        stack[sp++] = r
                                    }
                                }
                                if (x < w - 1) {
                                    r = q + 1;
                                    if (!bar[r] && !label_[r]) {
                                        label_[r] = L;
                                        stack[sp++] = r
                                    }
                                }
                                if (y > 0) {
                                    r = q - w;
                                    if (!bar[r] && !label_[r]) {
                                        label_[r] = L;
                                        stack[sp++] = r
                                    }
                                }
                                if (y < h - 1) {
                                    r = q + w;
                                    if (!bar[r] && !label_[r]) {
                                        label_[r] = L;
                                        stack[sp++] = r
                                    }
                                }
                            }
                        }
                        // краевые (сглаженные) пиксели и разрезы присоединяем к ближайшей области
                        var nl = new Int32Array(label_);
                        for (p = 0; p < n; p++) {
                            if (label_[p] || lum[p] < 100)
                                continue;
                            var px = p % w
                              , py = (p / w) | 0
                              , found = 0;
                            for (var rad = 1; rad <= 4 && !found; rad++) {
                                for (var dy2 = -rad; dy2 <= rad && !found; dy2++)
                                    for (var dx2 = -rad; dx2 <= rad; dx2++) {
                                        var X = px + dx2
                                          , Y = py + dy2;
                                        if (X < 0 || Y < 0 || X >= w || Y >= h)
                                            continue;
                                        var v = label_[Y * w + X];
                                        if (v) {
                                            found = v;
                                            break
                                        }
                                    }
                            }
                            if (found)
                                nl[p] = found;
                        }
                        var s = {
                            key: key,
                            w: w,
                            h: h,
                            lum: lum,
                            orig: orig,
                            label: nl,
                            color: new Int32Array(n).fill(-1),
                            id: id,
                            hist: []
                        };
                        cb(s);
                    }
                    ;
                    img.src = SRC[key];
                }
                function renderPx(s, p) {
                    var d = s.id.data
                      , c = s.color[p]
                      , i = p * 4;
                    if (c < 0) {
                        d[i] = s.orig[i];
                        d[i + 1] = s.orig[i + 1];
                        d[i + 2] = s.orig[i + 2];
                        return
                    }
                    var f = s.lum[p] / 235;
                    if (f > 1)
                        f = 1;
                    d[i] = ((c >> 16) & 255) * f;
                    d[i + 1] = ((c >> 8) & 255) * f;
                    d[i + 2] = (c & 255) * f;
                }
                function show(s) {
                    ctx.putImageData(s.id, 0, 0)
                }
                function open(key) {
                    tab = key;
                    label.textContent = "";
                    [].forEach.call(document.querySelectorAll(".tab"), function(b) {
                        b.classList.toggle("on", b.dataset.t === key)
                    });
                    function use(s) {
                        st = s;
                        cv.width = s.w;
                        cv.height = s.h;
                        show(s)
                    }
                    if (states[key])
                        use(states[key]);
                    else
                        build(key, function(s) {
                            states[key] = s;
                            use(s)
                        });
                }
                [].forEach.call(document.querySelectorAll(".tab"), function(b) {
                    b.onclick = function() {
                        open(b.dataset.t)
                    }
                });

                function pos(e) {
                    var r = cv.getBoundingClientRect();
                    return [Math.floor((e.clientX - r.left) * cv.width / r.width), Math.floor((e.clientY - r.top) * cv.height / r.height)];
                }
                var soundOn = true;
                try {
                    if (localStorage.getItem("cbSound") === "off")
                        soundOn = false
                } catch (e) {}
                function syncSnd() {
                    var b = document.getElementById("snd");
                    b.textContent = soundOn ? "🔊 Звук включён" : "🔇 Звук выключен";
                    b.classList.toggle("on", soundOn);
                    b.setAttribute("aria-pressed", soundOn);
                }
                document.getElementById("snd").onclick = function() {
                    soundOn = !soundOn;
                    syncSnd();
                    try {
                        localStorage.setItem("cbSound", soundOn ? "on" : "off")
                    } catch (e) {}
                    if (!soundOn && window.speechSynthesis) {
                        try {
                            speechSynthesis.cancel()
                        } catch (e) {}
                    }
                }
                ;
                syncSnd();
                function say(t) {
                    if (!t || !soundOn || !window.speechSynthesis)
                        return;
                    try {
                        speechSynthesis.cancel();
                        var u = new SpeechSynthesisUtterance(t);
                        u.lang = "en-US";
                        u.rate = .85;
                        speechSynthesis.speak(u)
                    } catch (e) {}
                }
                function snap() {
                    st.hist.push(new Int32Array(st.color));
                    if (st.hist.length > 15)
                        st.hist.shift()
                }
                var drawing = false
                  , curL = 0
                  , last = null
                  , raf = 0;
                function paintDisc(x, y, rad) {
                    var s = st
                      , w = s.w
                      , h = s.h
                      , r2 = rad * rad;
                    for (var yy = Math.max(0, y - rad); yy <= Math.min(h - 1, y + rad); yy++)
                        for (var xx = Math.max(0, x - rad); xx <= Math.min(w - 1, x + rad); xx++) {
                            if ((xx - x) * (xx - x) + (yy - y) * (yy - y) > r2)
                                continue;
                            var p = yy * w + xx;
                            if (s.label[p] === curL) {
                                s.color[p] = cur;
                                renderPx(s, p)
                            }
                        }
                }
                function schedule() {
                    if (!raf)
                        raf = requestAnimationFrame(function() {
                            raf = 0;
                            show(st)
                        })
                }
                cv.addEventListener("pointerdown", function(e) {
                    if (!st)
                        return;
                    var pt = pos(e)
                      , x = pt[0]
                      , y = pt[1];
                    if (x < 0 || y < 0 || x >= st.w || y >= st.h)
                        return;
                    var L = st.label[y * st.w + x];
                    var nm = NAMES[tab](x, y);
                    if (nm) {
                        label.textContent = nm;
                        say(nm)
                    }
                    if (!L)
                        return;
                    snap();
                    if (mode === "fill") {
                        var s = st;
                        for (var p = 0; p < s.label.length; p++)
                            if (s.label[p] === L) {
                                s.color[p] = cur;
                                renderPx(s, p)
                            }
                        show(s);
                    } else {
                        drawing = true;
                        curL = L;
                        last = pt;
                        cv.setPointerCapture(e.pointerId);
                        paintDisc(x, y, +document.getElementById("size").value);
                        schedule();
                    }
                });
                cv.addEventListener("pointermove", function(e) {
                    if (!drawing)
                        return;
                    var pt = pos(e)
                      , rad = +document.getElementById("size").value;
                    var dx = pt[0] - last[0]
                      , dy = pt[1] - last[1]
                      , steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / (rad / 2)));
                    for (var k = 1; k <= steps; k++)
                        paintDisc(Math.round(last[0] + dx * k / steps), Math.round(last[1] + dy * k / steps), rad);
                    last = pt;
                    schedule();
                });
                function stop() {
                    drawing = false
                }
                cv.addEventListener("pointerup", stop);
                cv.addEventListener("pointercancel", stop);
                document.getElementById("undo").onclick = function() {
                    if (!st || !st.hist.length)
                        return;
                    st.color = st.hist.pop();
                    for (var p = 0; p < st.color.length; p++)
                        renderPx(st, p);
                    show(st);
                }
                ;
                document.getElementById("reset").onclick = function() {
                    if (!st)
                        return;
                    snap();
                    st.color.fill(-1);
                    for (var p = 0; p < st.color.length; p++)
                        renderPx(st, p);
                    show(st);
                }
                ;
                open("food");
            }
            )();
        </script>
    </body>
</html>
